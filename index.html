<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Da’s Home Bakery — ระบบร้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2E8;--surface:#FFFFFF;--surface-2:#F5F8F1;--ink:#1D2A1B;--muted:#5B6955;--line:#D5DDCB;
  --green:#2E5A37;--on-green:#FFFFFF;--green-soft:#DDEAD3;
  --yolk:#F5C342;--yolk-soft:#FFF1C2;--on-yolk:#2B2105;--tomato:#C2402A;--tomato-soft:#FBE3DD;
  --shadow:0 1px 2px rgba(29,42,27,.07),0 10px 24px -14px rgba(29,42,27,.25);
  --r-lg:22px;--r-md:14px;--r-sm:10px;
  --f-body:"Anuphan","Noto Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif;
  --f-num:"Bricolage Grotesque","Anuphan",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F140F;--surface:#182018;--surface-2:#1E271E;--ink:#E6EEE0;--muted:#99A891;--line:#2C382B;
  --green:#93CC9E;--on-green:#0D190F;--green-soft:#1E3221;--yolk:#F5C342;--yolk-soft:#3A2F10;--on-yolk:#2B2105;
  --tomato:#FF7D64;--tomato-soft:#3A1E18;--shadow:0 1px 0 rgba(255,255,255,.03);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F140F;--surface:#182018;--surface-2:#1E271E;--ink:#E6EEE0;--muted:#99A891;--line:#2C382B;
  --green:#93CC9E;--on-green:#0D190F;--green-soft:#1E3221;--yolk:#F5C342;--yolk-soft:#3A2F10;--on-yolk:#2B2105;
  --tomato:#FF7D64;--tomato-soft:#3A1E18;--shadow:0 1px 0 rgba(255,255,255,.03);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--yolk);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
img{max-width:100%}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hd{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:40px;height:40px;flex:none;display:block}
.req{font-size:12px;font-weight:600;color:var(--tomato);margin-left:4px}
.req.ok{color:var(--green)}
.vgrid button.on{background:var(--green);color:var(--on-green);border-color:transparent}
.vgrid button.on span{color:inherit}
.nb{position:absolute;right:6px;bottom:6px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-size:15px}
.nb:hover{border-color:var(--green)}
.lnote{display:inline-block;margin-top:5px;font-size:12px;font-weight:600;color:var(--green);border:1px dashed var(--green);border-radius:999px;padding:1px 10px}
.chs{font-size:11px;font-weight:600;color:var(--green);background:var(--green-soft);border-radius:6px;padding:1px 7px;align-self:flex-start}
.brand b{font-weight:700;font-size:16px;line-height:1.1;display:block;white-space:nowrap}
.brand small{color:var(--muted);font-size:12px;display:block}
nav.tabs{margin-left:auto;display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;border:1px solid var(--line)}
nav.tabs button{padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted);font-size:14px;white-space:nowrap}
nav.tabs button.on{background:var(--green);color:var(--on-green)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block}
.sync.cloud i{background:#3FA35A}.sync.local i{background:var(--yolk)}.sync.slow i{background:var(--tomato)}
@media (max-width:720px){.hd{flex-wrap:wrap;padding:8px 12px;gap:8px}.brand small{display:none}nav.tabs{order:3;width:100%;margin:0}nav.tabs button{flex:1;padding:7px 6px}.sync{margin-left:auto}}

main{max-width:1400px;margin:0 auto;padding:18px}
@media (max-width:720px){main{padding:12px}}
h1,h2,h3{margin:0;line-height:1.2}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 2px 12px}
.sec-h h2{font-size:20px;font-weight:700}
.sec-h p{margin:0;color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:600;border:1px solid var(--line);background:var(--surface);min-height:42px}
.btn.pri{background:var(--green);color:var(--on-green);border-color:transparent}
.btn.yolk{background:var(--yolk);color:var(--on-yolk);border-color:transparent}
.btn.danger{color:var(--tomato);border-color:var(--tomato)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}

/* today strip */
.today{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.today .t{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 16px;display:flex;align-items:baseline;gap:10px}
.today .t span{color:var(--muted);font-size:13px}
.today .t b{font-family:var(--f-num);font-size:20px}

/* floor */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:28px}
.tbl{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:var(--shadow);transition:transform .12s}
.tbl:active{transform:scale(.98)}
.plate{width:84px;height:84px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;position:relative}
.plate .n{font-family:var(--f-num);font-weight:800;font-size:30px;color:var(--muted);position:relative;z-index:1}
.tbl.busy .plate{border:0;background:var(--yolk-soft);box-shadow:0 0 0 2px var(--line) inset}
.tbl.busy .plate svg{position:absolute;inset:7px;width:70px;height:70px}
.tbl.busy .plate .n{color:#5A3613;margin-top:4px}
.tbl .st{font-size:13px;color:var(--muted);min-height:40px}
.tbl.busy .st b{display:block;font-family:var(--f-num);font-size:18px;color:var(--ink)}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ticket{position:relative;background:var(--yolk-soft);border-radius:var(--r-md);padding:14px 16px;text-align:left;border:1px solid var(--line)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--bg);transform:translateY(-50%);border:1px solid var(--line)}
.ticket::before{left:-9px}.ticket::after{right:-9px}
.ticket h3{font-size:16px}
.ticket .meta{font-size:13px;color:var(--muted)}
.ticket b{font-family:var(--f-num);font-size:20px;display:block;margin-top:6px}
.ticket.add{background:transparent;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;color:var(--green);min-height:110px}
.ticket.add::before,.ticket.add::after{display:none}

/* order view */
.order-wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.order-wrap>section{min-width:0}
.ord-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ord-top h2{font-size:22px}
.ord-top input{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-width:0;flex:1;max-width:260px}
.search{position:relative;margin-bottom:10px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px 14px 12px 40px;font-size:16px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{padding:2px 0 10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5;background:var(--bg)}
.grp,.subs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.grp::-webkit-scrollbar,.subs::-webkit-scrollbar{display:none}
.subs{margin-top:8px}
.grp{flex-wrap:wrap;overflow:visible}
#items{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px)}
@media (max-width:960px){.chips{position:static}.grp{gap:6px}.gbtn{padding:5px 12px 5px 5px;font-size:14px;border-radius:12px}.gbtn span{width:28px;height:28px;font-size:15px;border-radius:8px}.subs{flex-wrap:wrap;overflow:visible}}
.gbtn{flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.gbtn span{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:17px}
.gbtn.on{background:var(--green);color:var(--on-green);border-color:transparent}
.gbtn.on span{background:rgba(255,255,255,.2)}
.srow{display:flex;gap:8px;margin-bottom:10px}
.srow .search{flex:1;margin:0}
.srow .btn{white-space:nowrap;border-radius:var(--r-md)}
.modrow{display:grid;grid-template-columns:1fr 84px auto;gap:8px;margin-top:12px;align-items:center}
.modrow .inp{padding:9px 10px}
.hint2{font-size:12px;color:var(--muted);margin:6px 0 0}
.mods{display:flex;flex-direction:column;gap:10px}
.mods .opt{display:inline-flex;align-items:center;gap:6px}
.mods .opt b{font-weight:700;color:var(--tomato);margin-left:2px}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat-h{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-weight:700;font-size:16px}
.cat-h small{color:var(--muted);font-weight:500;font-size:13px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.item{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 12px 10px;display:flex;flex-direction:column;gap:4px;min-height:84px;transition:border-color .12s,transform .1s}
.item:hover{border-color:var(--green)}
.item:active{transform:scale(.98)}
.item .nm{font-weight:600;line-height:1.3}
.item .ds{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .pr{margin-top:auto;font-family:var(--f-num);font-weight:700;color:var(--green)}
.item .q{position:absolute;top:-7px;right:-7px;min-width:26px;height:26px;border-radius:13px;background:var(--yolk);color:var(--on-yolk);font-family:var(--f-num);font-weight:800;font-size:13px;display:grid;place-items:center;padding:0 6px}
.item.off{opacity:.45}
.item.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(.95)}}
.empty{padding:30px;text-align:center;color:var(--muted)}

.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;max-height:calc((100vh - 100px) / var(--z,1));overflow:hidden}
.cart-h{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.cart-h h3{font-size:17px}
.cart-l{overflow-y:auto;padding:6px 10px;flex:1;min-height:80px}
.ln{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 8px;border-bottom:1px dashed var(--line);text-align:left;width:100%;border-radius:8px}
.ln:hover{background:var(--surface-2)}
.ln .qty{font-family:var(--f-num);font-weight:800;background:var(--green-soft);color:var(--green);border-radius:8px;min-width:32px;text-align:center;padding:2px 6px}
.ln .nm{font-weight:600;line-height:1.3}
.ln .sub{font-size:12px;color:var(--muted)}
.ln .am{font-family:var(--f-num);font-weight:700}
.cart-f{padding:14px 18px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.tot b{font-family:var(--f-num);font-size:28px}
.cart-f .row{display:flex;gap:8px}
.cart-f .row .btn{flex:1}
.cartbar{display:none}
.sheet-close{display:none}
@media (max-width:960px){
  .order-wrap{grid-template-columns:minmax(0,1fr)}
  .chips{top:calc(env(safe-area-inset-top,0px) + 96px)}
  .cart{display:none}
  .cart.open{display:flex;position:fixed;inset:auto 0 0 0;top:auto;max-height:86vh;z-index:60;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .cart.open .sheet-close{display:inline-flex}
  .cartbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--green);color:var(--on-green);border-radius:999px;padding:12px 20px;align-items:center;justify-content:space-between;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}
  .cartbar b{font-family:var(--f-num);font-size:18px}
  .order-wrap{padding-bottom:84px}
}
@media (max-width:720px){.chips{top:calc(env(safe-area-inset-top,0px) + 92px)}.items{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}

/* sheets */
.ov{position:fixed;inset:0;background:rgba(10,16,10,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);border-radius:var(--r-lg);width:min(520px,100%);max-height:88vh;overflow:auto;padding:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.sheet h3{font-size:19px;margin-bottom:4px}
.sheet .lead{color:var(--muted);font-size:14px;margin:0 0 14px}
.sheet .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
@media (max-width:640px){.ov{align-items:flex-end;padding:0}.sheet{border-radius:22px 22px 0 0;width:100%;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
.stepper{display:flex;align-items:center;gap:14px;margin:14px 0}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);font-size:22px;font-weight:600;background:var(--surface-2)}
.stepper b{font-family:var(--f-num);font-size:26px;min-width:40px;text-align:center}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--surface)}
.opt.on{background:var(--green);color:var(--on-green);border-color:transparent}
.opt small{opacity:.75;margin-left:4px}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:11px 12px;font-size:16px}
textarea.inp{min-height:70px;resize:vertical}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px}
.vgrid button{border:1px solid var(--line);border-radius:var(--r-md);padding:16px 10px;background:var(--surface-2);font-weight:600}
.vgrid button span{display:block;font-family:var(--f-num);color:var(--green);font-size:18px;margin-top:2px}
.sum-l{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.sum-l.big{font-size:20px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.sum-l .num{font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.change{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--green-soft);display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.change b{font-family:var(--f-num);font-size:24px;color:var(--green)}
.change.neg{background:var(--tomato-soft)}.change.neg b{color:var(--tomato)}

/* receipt */
.rc-wrap{background:var(--surface-2);border-radius:var(--r-md);padding:16px;display:flex;justify-content:center}
.rc{width:300px;max-width:100%;background:#fff;color:#111;padding:18px 16px;font-family:var(--f-body);font-size:13px;line-height:1.45;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.rc .c{text-align:center}
.rc .shop{font-weight:700;font-size:17px}
.rc hr{border:0;border-top:1px dashed #999;margin:10px 0}
.rc table{width:100%;border-collapse:collapse}
.rc td{vertical-align:top;padding:2px 0}
.rc td.r{text-align:right;white-space:nowrap;padding-left:8px}
.rc .ad{color:#555;font-size:12px;padding-left:14px}
.rc .big td{font-weight:700;font-size:16px;padding-top:6px}
#printArea{display:none}
@media print{
  @page{size:80mm auto;margin:4mm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  body::before{display:none}
  #printArea{display:block}
  #printArea .rc{box-shadow:none;width:100%;padding:0}
}

/* dashboard */
.dash-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.mpick{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.mpick button{width:36px;height:36px;border-radius:50%;font-size:18px}
.mpick button:hover{background:var(--surface-2)}
.mpick span{font-weight:700;min-width:130px;text-align:center}
.kpis{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.kpi{padding:16px 18px}
.kpi span{font-size:13px;color:var(--muted);display:block}
.kpi b{font-family:var(--f-num);font-size:28px;font-weight:700;display:block;line-height:1.2;margin-top:4px}
.kpi.hero{background:var(--green);color:var(--on-green);border-color:transparent}
.kpi.hero span{color:inherit;opacity:.8}
.kpi.hero b{font-size:44px;font-weight:800}
.kpi em{font-style:normal;font-size:13px;font-weight:600}
.up{color:#3FA35A}.down{color:var(--tomato)}
.kpi.hero .up,.kpi.hero .down{color:inherit;opacity:.9}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:12px}
.panel{padding:16px 18px}
.panel h3{font-size:16px;margin-bottom:2px}
.panel .hint{font-size:12px;color:var(--muted);margin:0 0 12px}
.bars{display:flex;align-items:flex-end;gap:3px;height:170px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;min-width:0}
.bars .b i{display:block;background:var(--green);border-radius:4px 4px 1px 1px;min-height:2px;height:var(--h)}
.bars .b.zero i{background:var(--line)}
.bars .b.hi i{background:var(--yolk)}
.bars .b:hover i{filter:brightness(1.15)}
.blabels{display:flex;gap:3px;margin-top:6px}
.blabels span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);min-width:0;overflow:hidden}
.rank{display:flex;flex-direction:column;gap:9px}
.rank .r{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center}
.rank .r .i{font-family:var(--f-num);font-weight:700;color:var(--muted);font-size:13px}
.rank .r .nm{font-size:14px;font-weight:500;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .r .bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:4px;overflow:hidden}
.rank .r .bar i{display:block;height:100%;background:var(--yolk);border-radius:3px}

/* write queue (one write at a time per order doc) */
const dirty=new Set(),timers={},inflight={};
function queueSave(id){dirty.add(id);clearTimeout(timers[id]);timers[id]=setTimeout(()=>{timers[id]=null;flush(id)},350)}
async function flush(id){
  if(inflight[id]){await inflight[id].catch(()=>{});if(timers[id])return}
  const o=state.orders[id];
  const p=o?B.setOrder(id,clone(o)):B.delOrder(id);inflight[id]=p;
  try{await p}catch(e){writeErr(e)}finally{inflight[id]=null;if(!timers[id])dirty.delete(id)}
}
async function flushNow(id){clearTimeout(timers[id]);timers[id]=null;dirty.add(id);await flush(id)}

function addVoid(o,l,q){if(q>0)o.voids=[...(o.voids||[]),{name:l.name,qty:q,opts:(l.opts||[]).filter(Boolean),at:Date.now()}]}
let ktTicket=null,ktFile=null;
function buildTicket(o,all){
  const items=o.items.filter(l=>all||l.qty>(l.sent||0)).map(l=>({qty:all?l.qty:l.qty-(l.sent||0),name:l.name,opts:(l.opts||[]).filter(Boolean),addons:(l.addons||[]).map(a=>a.n),note:l.note||''}));
  const voids=all?[]:(o.voids||[]).filter(v=>!v.printed);
  return{label:o.label,customer:o.customer||'',type:o.type,at:Date.now(),round:(o.kround||0)+1,all,items,voids}}
function kitchenHTML(t){return `<div class="rc kt"><div class="c"><div class="shop">ใบสั่งครัว</div><div class="kl">${esc(t.label)}</div>${t.customer?`<div>${esc(t.customer)}</div>`:''}
  <div>${t.type==='ta'?'TAKE AWAY':'นั่งทาน'} · รอบที่ ${t.round}${t.all?' (พิมพ์ซ้ำทั้งหมด)':''}</div><div>${dstr(t.at)} ${tstr(t.at)}</div></div><hr>
  ${t.items.map(l=>`<div class="ki"><b>${l.qty} × ${esc(l.name)}</b>${l.opts.map(x=>`<div class="ko">• ${esc(x)}</div>`).join('')}${l.addons.map(x=>`<div class="ko">+ ${esc(x)}</div>`).join('')}${l.note?`<div class="kn">หมายเหตุ: ${esc(l.note)}</div>`:''}</div>`).join('')}
  ${t.voids.length?`<div class="kv"><div class="c"><b>*** ยกเลิก ***</b></div>${t.voids.map(v=>`<div><b>${v.qty} × ${esc(v.name)}</b>${v.opts&&v.opts.length?` (${v.opts.map(esc).join(', ')})`:''}</div>`).join('')}</div>`:''}</div>`}
function paperW(){return state.config.paper==='58'?384:576}
async function drawRows(rows){const W=paperW(),P=W<500?14:28,K=W<500?.8:1;const F='"Anuphan","Noto Sans Thai","Leelawadee UI",Thonburi,sans-serif';try{await document.fonts.ready}catch(e){}
  const cv=document.createElement('canvas');const ctx=cv.getContext('2d');
  const wrap=(t,w,font)=>{ctx.font=font;const out=[];let cur='';for(const ch of Array.from(t)){if(ctx.measureText(cur+ch).width>w&&cur){out.push(cur);cur=ch}else cur+=ch}out.push(cur);return out};
  const lay=[];let y=P;
  rows.forEach(r=>{if(r.hr){lay.push({hr:1,y:y+10});y+=24;return}const sz=Math.round((r.sz||30)*K);const font=`${r.b?700:400} ${sz}px ${F}`;const ind=r.ind||0;
    wrap(r.l,W-2*P-ind,font).forEach(ln=>{lay.push({t:ln,font,c:r.c,x:P+ind,y:y+sz});y+=sz*1.35})});
  cv.width=W;cv.height=Math.ceil(y+P);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,cv.height);ctx.fillStyle='#000';
  lay.forEach(o=>{if(o.hr){ctx.setLineDash([8,6]);ctx.strokeStyle='#444';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(P,o.y);ctx.lineTo(W-P,o.y);ctx.stroke();return}
    ctx.font=o.font;if(o.c){ctx.textAlign='center';ctx.fillText(o.t,W/2,o.y)}else{ctx.textAlign='left';ctx.fillText(o.t,o.x,o.y)}});
  return new Promise(res=>cv.toBlob(res,'image/png'))}
function kitchenPng(t){const R=[];const T=(l,o={})=>R.push({l,...o});
  T('ใบสั่งครัว',{c:1,b:1,sz:30});T(t.label,{c:1,b:1,sz:52});if(t.customer)T(t.customer,{c:1,sz:30});
  T(`${t.type==='ta'?'TAKE AWAY':'นั่งทาน'} · รอบที่ ${t.round}${t.all?' (พิมพ์ซ้ำ)':''}`,{c:1,sz:26});T(`${dstr(t.at)} ${tstr(t.at)}`,{c:1,sz:26});R.push({hr:1});
  t.items.forEach(l=>{T(`${l.qty} × ${l.name}`,{b:1,sz:36});l.opts.forEach(x=>T('• '+x,{ind:34,sz:30}));l.addons.forEach(x=>T('+ '+x,{ind:34,sz:30}));if(l.note)T('หมายเหตุ: '+l.note,{ind:34,b:1,sz:30});R.push({hr:1})});
  if(t.voids.length){T('*** ยกเลิก ***',{c:1,b:1,sz:36});t.voids.forEach(v=>T(`${v.qty} × ${v.name}${v.opts&&v.opts.length?' ('+v.opts.join(', ')+')':''}`,{b:1,sz:32}));R.push({hr:1})}
  return drawRows(R)}
function kitchenSheet(all=false){const o=getActive();if(!o)return;
  let t=buildTicket(o,all);if(!all&&!t.items.length&&!t.voids.length){t=buildTicket(o,true)}
  ktTicket=t;ktFile=null;kitchenPng(t).then(bl=>{if(bl&&ktTicket===t)ktFile=new File([bl],`kitchen-${Date.now()}.png`,{type:'image/png'})}).catch(()=>{});
  openSheet(()=>`<h3>🍳 ส่งครัว ${esc(t.label)}</h3><p class="lead">${t.all?'พิมพ์ซ้ำทุกรายการ':'เฉพาะรายการที่ยังไม่เคยส่ง'} · ไม่มีราคา</p>
    <div class="rc-wrap">${kitchenHTML(t)}</div>
    <div class="acts">${CAN_SHARE?'<button class="btn yolk" data-a="ktShare" style="flex-basis:100%">📤 แชร์ไปเครื่องพิมพ์</button>':''}<button class="btn ${CAN_SHARE?'':'yolk'}" data-a="ktPrint">พิมพ์</button>${t.all?'':'<button class="btn" data-a="ktAll">พิมพ์ซ้ำทั้งหมด</button>'}</div>
    <div class="acts" style="margin-top:8px"><button class="btn ghost sm" data-a="ktMark">ทำเครื่องหมายว่าส่งแล้ว (ไม่พิมพ์)</button><button class="btn" data-a="closeSheet">ปิด</button></div>`)}
function markSent(){mutate(o=>{o.items.forEach(l=>{l.sent=l.qty});(o.voids||[]).forEach(v=>{v.printed=true});o.kround=(o.kround||0)+1});closeSheet();toast('ส่งครัวแล้ว')}
async function saveFile(filename,data){
  try{
    if(DL){await DL.save({filename,data});toast('บันทึกไฟล์แล้ว');return}
    const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
  }catch(e){if(e&&e.code==='declined')return;toast('บันทึกไฟล์ไม่ได้ในหน้านี้')}
}

  const cv=document.createElement('canvas');const ctx=cv.getContext('2d');
  const wrap=(t,w,font)=>{ctx.font=font;const out=[];let cur='';for(const ch of Array.from(t)){if(ctx.measureText(cur+ch).width>w&&cur){out.push(cur);cur=ch}else cur+=ch}out.push(cur);return out};
  const lay=[];let y=P;
  rows.forEach(r=>{if(r.hr){lay.push({hr:1,y:y+10});y+=22;return}const sz=Math.round((r.sz||(r.sm?22:26))*K);const font=`${r.b?700:400} ${sz}px ${F}`;
    ctx.font=font;const rw=r.r?ctx.measureText(r.r).width+16:0;const lines=wrap(r.l,W-2*P-rw,font);
    lines.forEach((ln,i)=>{lay.push({t:ln,r:i===0?r.r:'',font,c:r.c,y:y+sz});y+=sz*1.4})});

function billsOf(mk){return state.days.filter(d=>d.date.startsWith(mk)).flatMap(d=>d.bills||[])}
function shiftMonth(mk,n){const[y,m]=mk.split('-').map(Number);return monthKey(new Date(y,m-1+n,1))}

  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  let rows=[['เลขที่บิล','วันที่','เวลา','ประเภท','โต๊ะ/ลูกค้า','รายการ','ยอดอาหาร','ส่วนลด','ยอดชำระ','ชำระด้วย','สถานะ']];
  bills.forEach(b=>rows.push([b.no,b.date,tstr(b.at),b.type==='ta'?'Take away':'นั่งทาน',b.label+(b.customer?' '+b.customer:''),b.items.map(l=>`${l.qty}x ${l.name}${(l.opts||[]).length?' ['+l.opts.join(', ')+']':''}${(l.addons||[]).length?' (+'+l.addons.map(a=>a.n).join(', ')+')':''}`).join('; '),b.subtotal,b.discount,b.total,METHODS[b.method]||b.method,b.void?'ยกเลิก':'ปกติ']));
  const csv='\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n');
  saveFile(`sales-${mk}.csv`,csv);
}

    const name=$('#nName').value.trim(),price=+$('#nPrice').value,cat=$('#nCat').value;
    if(!name){toast('ใส่ชื่อเมนูก่อน');$('#nName').focus();return}if(!(price>=0)||$('#nPrice').value===''){toast('ใส่ราคาก่อน');$('#nPrice').focus();return}
    const cfg=state.config;let cid=cat;
    if(cat==='__new'){const cn=$('#nCatName').value.trim();if(!cn){toast('ใส่ชื่อหมวดใหม่');return}cid='c'+uid();cfg.customCats=[...(cfg.customCats||[]),{id:cid,th:cn,en:'',icon:'🍽️'}]}
    cfg.custom=[...(cfg.custom||[]),{id:'x'+uid(),cat:cid,name,price,desc:$('#nDesc').value.trim()}];
    saveConfig();render();toast('เพิ่ม “'+name+'” แล้ว')},
  delMenu:async t=>{const it=MENU.byId[t.dataset.id];if(!(await confirmBox('ลบเมนูนี้?',esc(it.name)+' จะหายจากหน้าสั่งอาหาร ยอดขายเดิมยังอยู่','ลบเมนู',true)))return;
    state.config.custom=(state.config.custom||[]).filter(x=>x.id!==it.id);saveConfig();render()},
  toggleHide:t=>{if(state.readOnly)return;const id=t.dataset.id;const h=new Set(state.config.hidden||[]);h.has(id)?h.delete(id):h.add(id);state.config.hidden=[...h];saveConfig();
    const open=[...document.querySelectorAll('details.mcat')].map(d=>d.open);render();document.querySelectorAll('details.mcat').forEach((d,i)=>d.open=open[i])},
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=A[t.dataset.a];if(f){e.preventDefault();f(t,e)}});
document.addEventListener('input',e=>{const t=e.target;const k=t.dataset?.in;if(!k)return;
  if(k==='search'){state.search=t.value;renderItems()}
  else if(k==='pknote'){if(pick)pick.note=t.value}
  else if(k==='note'){const v=t.value;clearTimeout(t._t);t._t=setTimeout(()=>mutate(o=>{const l=o.items.find(x=>x.k===editK);if(l)l.note=v}),300)}
  else if(k==='customer'){const v=t.value;clearTimeout(t._t);t._t=setTimeout(()=>mutate(o=>{o.customer=v}),400)}
  else if(k==='dv'){co.dv=t.value;const o=getActive();const c=calc(o);$('#discV').textContent='−'+baht(c.disc);$('#totV').textContent=baht(c.total);const ch=$('#chg');if(ch)ch.innerHTML=changeHTML(c.total)}
  else if(k==='rec'){co.rec=t.value;const ch=$('#chg');if(ch)ch.innerHTML=changeHTML(calc(getActive()).total)}
});
document.addEventListener('change',e=>{const t=e.target;const k=t.dataset?.in;if(!k)return;
  if(state.readOnly&&k!=='ncat'){toast('บัญชีนี้ดูได้อย่างเดียว');return}
  if(k==='ncat'){$('#newCatBox').hidden=t.value!=='__new'}
  else if(k==='price'){const id=t.dataset.id,v=Math.max(0,+t.value||0);const pr={...(state.config.prices||{})};const it=MENU.byId[id];
    if(it.custom){state.config.custom=state.config.custom.map(x=>x.id===id?{...x,price:v}:x)}
    else if(it.variants){const arr=Array.isArray(pr[id])?[...pr[id]]:it.variants.map(x=>x[1]);arr[+t.dataset.j]=v;pr[id]=arr;state.config.prices=pr}
    else{pr[id]=v;state.config.prices=pr}saveConfig();toast('บันทึกราคาแล้ว')}
  else if(k==='shop'){state.config.shop={...(state.config.shop||{}),[t.dataset.k]:t.value};saveConfig()}
  else if(k==='tables'){state.config.tables=Math.max(1,Math.min(60,+t.value||10));saveConfig()}
  else if(k==='tname'){const tn={...(state.config.tableNames||{})};const v=t.value.trim();if(v)tn[t.dataset.n]=v;else delete tn[t.dataset.n];state.config.tableNames=tn;saveConfig();syncTableLabels();if(state.view==='floor'&&!$('#ov'))render()}
  else if(k==='paper'){state.config.paper=t.value;saveConfig();toast('ตั้งกระดาษ '+t.value+' มม. แล้ว')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#ov'))closeSheet();else A.closeCart()}
  if(e.key==='Enter'&&e.target.dataset?.in==='search'){e.preventDefault();const q=state.search.trim().toLowerCase();if(!q)return;
    let list=codeHit(q);if(!list.length)list=MENU.items.filter(i=>!i.hidden&&matchQ(i,q));
    if(list.length===1){e.target.value='';state.search='';renderItems();tapItem(list[0])}else if(list.length>1)toast('เจอ '+list.length+' เมนู แตะเลือกจากรายการ');else toast('ไม่พบเมนูนี้');return}
  if(e.key==='Enter'){const id=e.target.id;if(id==='modName'||id==='modPrice'){e.preventDefault();A.addMod()}else if(id==='lgE'||id==='lgP'){e.preventDefault();A.login()}else if(id==='oiName'||id==='oiPrice'||id==='oiQty'){e.preventDefault();A.addOpen()}}});
setInterval(()=>{if(state.view==='floor'&&state.ready&&!$('#ov'))render()},60000);

const FIREBASE_CONFIG={apiKey:"AIzaSyAHihr_liJ-VIVOTBzj_EFirbqBjCevj_s",authDomain:"da-shop-d7ddd.firebaseapp.com",projectId:"da-shop-d7ddd",storageBucket:"da-shop-d7ddd.firebasestorage.app",messagingSenderId:"144083307959",appId:"1:144083307959:web:4a6c8da60084d6e2876c32"}; // DA SHOP
const FBV='10.12.2';let FB_AUTH=null;
const FBStore={...Cloud,loaded:{},
  start(db){const W=q=>({onSnapshot:(n,e)=>q.onSnapshot({includeMetadataChanges:true},n,e),orderBy:(...a)=>W(q.orderBy(...a)),limit:(...a)=>W(q.limit(...a))});
    Cloud.start.call(this,{collection:p=>W(db.collection(p)),doc:p=>W(db.doc(p))});this.db=db},
  async saveConfig(c){const cm={};for(const[k,a]of Object.entries(c.customMods||{}))cm[k]=(a||[]).map(x=>Array.isArray(x)?{n:x[0],p:x[1]}:x);await this.db.doc('config/main').set({...c,customMods:cm})},
  async closeBill(b){const ref=this.db.doc('days/'+b.date);return this.db.runTransaction(async tx=>{const s=await tx.get(ref);const bills=[...((s.exists&&s.data().bills)||[])];const nb={...b,no:billNo(b.date,bills.length+1)};bills.push(nb);tx.set(ref,{date:b.date,bills});return nb})},
  async voidBill(date,no){const ref=this.db.doc('days/'+date);await this.db.runTransaction(async tx=>{const s=await tx.get(ref);if(!s.exists)return;const bills=(s.data().bills||[]).map(x=>x.no===no?{...x,void:true}:x);tx.set(ref,{date,bills})})}};
function getFbConfig(){try{const v=localStorage.getItem('dhbpos:fb');if(v)return JSON.parse(v)}catch(e){}return FIREBASE_CONFIG}
function parseFbConfig(t){const out={};const re=/([A-Za-z]+)\s*["']?\s*:\s*["']([^"']+)["']/g;let m;while((m=re.exec(t)))out[m[1]]=m[2];return out.apiKey&&out.projectId&&out.appId?out:null}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}
async function startFirebase(cfg){
  for(const m of ['app','auth','firestore'])await loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-${m}-compat.js`);
  if(!firebase.apps.length)firebase.initializeApp(cfg);
  FB_AUTH=firebase.auth();const fs=firebase.firestore();
  try{fs.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  setSync('connecting');
  const u=await new Promise(res=>{const un=FB_AUTH.onAuthStateChanged(x=>{un();res(x)})});
  if(u)goFirebase(u);else showLogin();
}
function goFirebase(u){document.body.classList.remove('locked');B=FBStore;state.fbUser=u.email||'';state.ready=false;state.view='floor';render();FBStore.start(firebase.firestore());
  const wait=setInterval(()=>{if(state.ready){clearInterval(wait);buildMenu();render()}},150)}
function showLogin(){document.body.classList.add('locked');state.ready=true;state.view='login';setSync('slow');$('#sync span').textContent='ยังไม่ได้เข้าสู่ระบบ';render();setTimeout(()=>$('#lgE')?.focus(),50)}
function loginHTML(){return `<div class="card panel" style="max-width:400px;margin:40px auto"><h3>เข้าสู่ระบบร้าน</h3><p class="hint">ใช้อีเมลและรหัสผ่านที่สร้างไว้ใน Firebase เข้าครั้งเดียว เครื่องจะจำไว้</p>
  <label class="f" for="lgE">อีเมล</label><input class="inp" id="lgE" type="email" autocomplete="username">

  <div class="acts"><button class="btn pri" data-a="login" id="lgBtn">เข้าสู่ระบบ</button></div>
  <details style="margin-top:14px;font-size:13px"><summary style="cursor:pointer;color:var(--muted)">เข้าไม่ได้? วาง firebaseConfig ใหม่</summary>
    <textarea class="inp" id="fbCfg" style="min-height:110px;font-size:12px;margin-top:8px;font-family:ui-monospace,Menlo,monospace" placeholder="วาง const firebaseConfig = {...}; จาก Firebase Console"></textarea>
    <div class="acts"><button class="btn sm" data-a="fbConnect">บันทึก config</button></div></details>
  <div style="text-align:center;margin-top:10px"><button class="btn ghost sm" data-a="fbForget">ยกเลิกการเชื่อมต่อ Firebase</button></div></div>`}
function fbPanelHTML(){
  if(window.claude&&B===Cloud)return '';

    <textarea class="inp" id="fbCfg" style="min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace" placeholder="const firebaseConfig = {
  apiKey: &quot;...&quot;,
  authDomain: &quot;...&quot;,
  projectId: &quot;...&quot;,
  ...
};"></textarea>
    <div class="acts"><button class="btn pri" data-a="fbConnect">เชื่อมต่อ</button></div></div>`}

/* ================== boot ================== */
function startLocal(){B=Local;Local.start();setSync('local');state.ready=true;buildMenu();render()}
(async function init(){
  applyLocalPrefs();buildMenu();render();
  let db=null;
  if(window.claude&&typeof window.claude.use==='function'){
    try{const r=await Promise.all([window.claude.use('db'),window.claude.use('downloads')]);db=r[0];DL=r[1]}catch(e){}
  }
  if(db){B=Cloud;setSync('connecting');Cloud.start(db);
    const wait=setInterval(()=>{if(state.ready){clearInterval(wait);buildMenu();render()}},150);}
  else{const cfg=getFbConfig();
    if(cfg){try{await startFirebase(cfg)}catch(e){console.error(e);startLocal();toast('เชื่อมต่อ Firebase ไม่สำเร็จ ตอนนี้บันทึกในเครื่องแทน')}}
    else startLocal();}
})();
